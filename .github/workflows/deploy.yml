name: Deploy Contracts to Shellnet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENDPOINT: "https://shellnet.ackinacki.org/graphql"
      # deployer pubkey (owner of Items/Arena + multisig custodian)
      OWNER_KEY: "0xc8f43f24be0fb530d4752b68421c5d3dfd377ebc9459ee5442c5f3cf7719fc72"
      # funded single-custodian multisig for pre-deploy funding
      MSIG: "73e271257c9b6b5b32f31d1af74dce240e2113f13db959c09c4a534ebf959847::73e271257c9b6b5b32f31d1af74dce240e2113f13db959c09c4a534ebf959847"
    steps:
      - uses: actions/checkout@v4

      - name: Download tvm-cli (x86_64)
        run: |
          wget -q https://github.com/tvmlabs/tvm-sdk/releases/download/v3.0.5.an/tvm-cli-3.0.5.an-linux-musl-amd64.tar.gz
          tar -xzf tvm-cli-3.0.5.an-linux-musl-amd64.tar.gz
          chmod +x tvm-cli
          ./tvm-cli config -g --url shellnet.ackinacki.org

      - name: Download sold 0.81.0 (x86_64, required version)
        run: |
          wget -q https://github.com/gosh-sh/TVM-Solidity-Compiler/releases/download/gosh_0.81.0/sold_gosh_0.81.0_linux_x86_64.tar.gz
          tar -xzf sold_gosh_0.81.0_linux_x86_64.tar.gz
          chmod +x sold
          ./sold --version

      - name: Restore deploy keys
        run: |
          echo '${{ secrets.DEPLOY_KEYS_JSON }}' > deploy.keys.json
          chmod 600 deploy.keys.json
          echo "keys restored (contents never printed)"

      - name: Compile contracts (sold --tvm-version gosh)
        run: |
          cd chain
          for C in PerimeterProfiles PerimeterItems PerimeterArena; do
            ../sold --tvm-version gosh "$C.sol"
            ls -la "$C.tvc" "$C.abi.json"
          done

      - name: Compute future addresses (offline)
        id: addrs
        run: |
          cd chain
          P=$(../tvm-cli -j genaddr PerimeterProfiles.tvc --abi PerimeterProfiles.abi.json --setkey ../deploy.keys.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['dapp_account'])")
          I=$(../tvm-cli -j genaddr PerimeterItems.tvc --abi PerimeterItems.abi.json --setkey ../deploy.keys.json --data '{"ownerKey":"${{ env.OWNER_KEY }}"}' | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['dapp_account'])")
          A=$(../tvm-cli -j genaddr PerimeterArena.tvc --abi PerimeterArena.abi.json --setkey ../deploy.keys.json --data '{"ownerKey":"${{ env.OWNER_KEY }}"}' | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['dapp_account'])")
          echo "PROFILES_ADDR=${P}" >> $GITHUB_OUTPUT
          echo "ITEMS_ADDR=${I}" >> $GITHUB_OUTPUT
          echo "ARENA_ADDR=${A}" >> $GITHUB_OUTPUT
          echo "Profiles: ${P}"
          echo "Items: ${I}"
          echo "Arena: ${A}"

      - name: Fund future addresses from multisig (flag 16 = SHELL→VMSHELL)
        run: |
          for A in "${{ steps.addrs.outputs.PROFILES_ADDR }}" "${{ steps.addrs.outputs.ITEMS_ADDR }}" "${{ steps.addrs.outputs.ARENA_ADDR }}"; do
            ACC=$(echo "$A" | cut -d: -f1)
            echo "Funding 0:${ACC}"
            ./tvm-cli -u shellnet.ackinacki.org callx \
              --abi chain/Multisig.abi.json \
              --keys deploy.keys.json \
              --addr "${{ env.MSIG }}" \
              -m sendTransaction "{\"dest\":\"0:${ACC}\",\"value\":1000000000,\"cc\":{\"2\":500000000000},\"bounce\":false,\"flags\":16,\"payload\":\"\"}" 2>&1 | tail -4
            sleep 5
          done

      - name: Deploy PerimeterProfiles
        id: profiles
        run: |
          P_ACCT=$(echo "${{ steps.addrs.outputs.PROFILES_ADDR }}" | cut -d: -f1)
          ./tvm-cli -u shellnet.ackinacki.org deploy \
            --dst-dapp-id "${P_ACCT}" \
            --abi chain/PerimeterProfiles.abi.json \
            --sign deploy.keys.json \
            chain/PerimeterProfiles.tvc '{"value":0}' 2>&1 | tee deploy_profiles.log
          echo "PROFILES_ADDR=${{ steps.addrs.outputs.PROFILES_ADDR }}" >> $GITHUB_OUTPUT

      - name: Deploy PerimeterItems
        id: items
        run: |
          I_ACCT=$(echo "${{ steps.addrs.outputs.ITEMS_ADDR }}" | cut -d: -f1)
          ./tvm-cli -u shellnet.ackinacki.org deploy \
            --dst-dapp-id "${I_ACCT}" \
            --abi chain/PerimeterItems.abi.json \
            --sign deploy.keys.json \
            --data '{"ownerKey":"${{ env.OWNER_KEY }}"}' \
            chain/PerimeterItems.tvc '{"value":0}' 2>&1 | tee deploy_items.log
          echo "ITEMS_ADDR=${{ steps.addrs.outputs.ITEMS_ADDR }}" >> $GITHUB_OUTPUT

      - name: Deploy PerimeterArena
        id: arena
        run: |
          A_ACCT=$(echo "${{ steps.addrs.outputs.ARENA_ADDR }}" | cut -d: -f1)
          ./tvm-cli -u shellnet.ackinacki.org deploy \
            --dst-dapp-id "${A_ACCT}" \
            --abi chain/PerimeterArena.abi.json \
            --sign deploy.keys.json \
            --data '{"ownerKey":"${{ env.OWNER_KEY }}"}' \
            chain/PerimeterArena.tvc '{"value":0}' 2>&1 | tee deploy_arena.log
          echo "ARENA_ADDR=${{ steps.addrs.outputs.ARENA_ADDR }}" >> $GITHUB_OUTPUT

      - name: Verify contracts are Active
        run: |
          ./tvm-cli -u shellnet.ackinacki.org account "${{ steps.profiles.outputs.PROFILES_ADDR }}" | grep -E "acc_type|balance" | head -3
          ./tvm-cli -u shellnet.ackinacki.org account "${{ steps.items.outputs.ITEMS_ADDR }}" | grep -E "acc_type|balance" | head -3
          ./tvm-cli -u shellnet.ackinacki.org account "${{ steps.arena.outputs.ARENA_ADDR }}" | grep -E "acc_type|balance" | head -3
          ./tvm-cli -u shellnet.ackinacki.org run "${{ steps.profiles.outputs.PROFILES_ADDR }}" getStats {} --abi chain/PerimeterProfiles.abi.json

      - name: Set NPC Prices (PerimeterItems)
        if: steps.items.outputs.ITEMS_ADDR != ''
        run: |
          ITEMS_ADDR="${{ steps.items.outputs.ITEMS_ADDR }}"
          echo "Setting NPC prices on ${ITEMS_ADDR}"

          # Item prices in credits (nano-credits, 9 decimals)
          declare -A PRICES=(
            ["usp"]=100000000
            ["pm"]=120000000
            ["gsh18"]=150000000
            ["ak74u"]=250000000
            ["ak47"]=400000000
            ["m4"]=500000000
            ["val"]=600000000
            ["groza"]=800000000
            ["svd"]=1000000000
            ["barrett"]=2000000000
            ["rpk"]=600000000
            ["m60"]=1200000000
            ["minigun"]=3000000000
            ["rpg7"]=1500000000
            ["vest1"]=200000000
            ["vest2"]=400000000
            ["vest3"]=800000000
            ["helmet1"]=150000000
            ["helmet2"]=300000000
            ["helmet3"]=600000000
            ["legs1"]=150000000
            ["legs2"]=300000000
            ["legs3"]=600000000
            ["suit_nord"]=1000000000
            ["suit_grom"]=2000000000
            ["exo_hrebet"]=4000000000
            ["stalker_suit"]=800000000
            ["dog_armor"]=500000000
            ["imp_acc"]=200000000
            ["imp_refl"]=300000000
            ["imp_med"]=400000000
            ["imp_stealth"]=600000000
            ["imp_berserk"]=800000000
            ["medkit"]=50000000
            ["medkit_large"]=100000000
            ["grenade"]=80000000
            ["scrap"]=10000000
            ["leather"]=20000000
            ["comp"]=50000000
            ["crystal"]=200000000
            ["machete"]=100000000
          )

          for CODE in "${!PRICES[@]}"; do
            PRICE="${PRICES[$CODE]}"
            echo "Setting $CODE = $PRICE"
            ./tvm-cli -u shellnet.ackinacki.org callx \
              --abi chain/PerimeterItems.abi.json \
              --keys deploy.keys.json \
              --addr "${ITEMS_ADDR}" \
              -m setNpcPrice "{\"itemCode\":\"$CODE\",\"price\":$PRICE}" 2>&1 | tail -3
            sleep 1
          done

      - name: Upload Deploy Info
        uses: actions/upload-artifact@v4
        with:
          name: deploy-results
          path: |
            deploy_profiles.log
            deploy_items.log
            deploy_arena.log
            chain/PerimeterProfiles.tvc
            chain/PerimeterProfiles.abi.json
            chain/PerimeterItems.tvc
            chain/PerimeterItems.abi.json
            chain/PerimeterArena.tvc
            chain/PerimeterArena.abi.json
          retention-days: 30

      - name: Summary
        run: |
          echo "## ✅ Contracts Deployed to Shellnet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Address |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| PerimeterProfiles | ${{ steps.profiles.outputs.PROFILES_ADDR }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PerimeterItems | ${{ steps.items.outputs.ITEMS_ADDR }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PerimeterArena | ${{ steps.arena.outputs.ARENA_ADDR }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Copy addresses to game (Profile tab) and chain/sync.mjs" >> $GITHUB_STEP_SUMMARY
          echo "2. Test: \`node sync.mjs read\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Commit & push updated files" >> $GITHUB_STEP_SUMMARY
